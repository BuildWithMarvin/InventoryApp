name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "feature/*"
  pull_request:
    branches:
      - "main"

jobs:
  # ---------------------------------------------
  # TEIL 1: CI (Continuous Integration) - Bauen & Testen
  # Runs on: feature/* Branches & main
  # ---------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Passt für .NET 8 (Ggf. an deine Version anpassen)

    - name: Restore Dependencies
      run: dotnet restore ./InventoryApp.Api/InventoryApp.Api.csproj

    - name: Build API
      run: dotnet build ./InventoryApp.Api/InventoryApp.Api.csproj --no-restore --configuration Release

    - name: Run xUnit Tests
      run: dotnet test ./InventoryApp.Tests/InventoryApp.Tests.csproj --no-build --configuration Release --verbosity normal
  # ---------------------------------------------
  # TEIL 2: CD (Continuous Deployment) - Azure Upload
  # Startet NUR auf dem 'main'-Branch UND wenn 'build-and-test' erfolgreich war!
  # ---------------------------------------------
  deploy-to-azure:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Das stellt sicher, dass NUR vom main-Branch auf Azure deployt wird

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish API
      run: dotnet publish ./InventoryApp.Api/InventoryApp.Api.csproj -c Release -o ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'InventoryApi-MarvinFranke' # <-- Trage hier den genauen Namen deiner Azure Web App ein
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - "main"
      - "ft/*"
      - "refactor/*"
  pull_request:
    branches:
      - "main"

jobs:

  # =============================================
  # CI - UNIT TESTS
  # =============================================

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./InventoryApp.Api/InventoryApp.Api.csproj

      - name: Build API
        run: dotnet build ./InventoryApp.Api/InventoryApp.Api.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test ./InventoryApp.Tests/InventoryApp.Tests.csproj --configuration Release --verbosity normal --filter "Category=Unit"


  # =============================================
  # CI - INTEGRATION TESTS
  # =============================================

  integration-tests:
    runs-on: ubuntu-latest

    services:
      sql-server:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "TestPassword123!"
        ports:
          - 1433:1433

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./InventoryApp.Api/InventoryApp.Api.csproj

      - name: Build API
        run: dotnet build ./InventoryApp.Api/InventoryApp.Api.csproj --no-restore --configuration Release

      - name: Run Integration Tests
        run: dotnet test ./InventoryApp.Tests/InventoryApp.Tests.csproj --configuration Release --verbosity normal --filter "Category=Integration"
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=IntegrationTestDb;User Id=sa;Password=TestPassword123!;TrustServerCertificate=True;Encrypt=False;"


  # =============================================
  # CD - DEPLOY TO AZURE
  # =============================================

  deploy-to-azure:
    needs:
      - unit-tests
      - integration-tests

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./InventoryApp.Api/InventoryApp.Api.csproj

      # --- EF Core Tool & Azure DB Migration ---

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Apply EF Core Migrations to Azure DB
        run: |
          dotnet ef database update \
            --project ./InventoryApp.Api/InventoryApp.Api.csproj \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      # --- App Publishing & Deployment ---

      - name: Publish API
        run: dotnet publish ./InventoryApp.Api/InventoryApp.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'InventoryApi-MarvinFranke'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish